[project]
name = "lanpaint-pipeline"
version = "0.1.0"
description = "LanPaint: training-free inpainting pipeline for diffusion models"
requires-python = ">=3.10"
dependencies = [
    "LanPaint @ git+https://github.com/scraed/LanPaint.git",
    "torch",
    "diffusers>=0.41.0.dev0",
    "transformers>=5.19.0",
    "accelerate>=1.12.0",
    "torchvision",
    "numpy",
    "Pillow",
    "scipy",
    "tqdm",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lanpaint_pipeline*"]
